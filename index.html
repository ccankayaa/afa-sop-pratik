<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Diamond DA20-C1 için 144 soruluk bağımsız SOP çalışma uygulaması. Test çözün, cevapları inceleyin ve ilerlemenizi takip edin."
    />
    <meta name="theme-color" content="#0b111b" />
    <title>AFA SOP Pratik · DA20-C1</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="questions.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <noscript
      >Testleri çözebilmek için JavaScript’i etkinleştirin. / Enable JavaScript
      to practice.</noscript
    >
    <a class="skip-link" href="#main" id="skip-link">İçeriğe geç</a>
    <aside class="sidebar" id="sidebar" aria-label="Çalışma menüsü">
      <a class="brand" href="#home" aria-label="AFA SOP Pratik">
        <span class="brand-mark"
          ><svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#plane"></use></svg
        ></span>
        <span class="brand-copy"
          ><strong>SOP<span>PRATİK</span></strong
          ><small>DIAMOND DA20-C1</small></span
        >
      </a>
      <button
        class="icon-button drawer-close"
        id="close-menu"
        type="button"
      ></button>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-bottom">
        <div class="academy-logo">
          <img
            src="assets/afa-logo.png"
            alt="AFA — Atlantic Flight Academy"
            width="500"
            height="342"
          />
        </div>
        <p id="disclaimer"></p>
        <p id="privacy-note"></p>
        <button
          class="text-button storage-settings"
          data-action="storage-settings"
          id="storage-settings"
          type="button"
        ></button>
        <a
          class="developer"
          href="https://github.com/ccankayaa"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#brand-github"></use>
          </svg>
          <span id="developer-label"></span>
          <svg class="icon external" aria-hidden="true">
            <use href="assets/icons.svg#external-link"></use>
          </svg>
        </a>
      </div>
    </aside>
    <button
      class="scrim"
      id="scrim"
      type="button"
      tabindex="-1"
      hidden
    ></button>
    <div class="shell" id="shell">
      <header class="topbar">
        <div class="topbar-start">
          <button
            class="icon-button"
            id="menu-toggle"
            type="button"
            aria-controls="sidebar"
            aria-expanded="true"
          ></button>
          <span class="breadcrumb"
            ><span class="breadcrumb-brand">SOP Pratik</span
            ><span class="breadcrumb-divider">/</span
            ><span id="page-label"></span
          ></span>
        </div>
        <div class="topbar-actions">
          <span class="local-status" id="local-status"></span>
          <button class="icon-button" id="theme-toggle" type="button"></button>
          <div class="language-switch" role="group" id="language-switch">
            <button type="button" data-language="tr" lang="tr">TR</button>
            <button type="button" data-language="en" lang="en">EN</button>
          </div>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <section
      id="storage-banner"
      class="storage-banner"
      aria-labelledby="storage-title"
      hidden
    ></section>
    <dialog
      id="confirmation"
      aria-labelledby="confirmation-title"
      aria-describedby="confirmation-text"
    >
      <form method="dialog" class="dialog-content">
        <span class="dialog-icon" id="dialog-icon"></span>
        <h2 id="confirmation-title"></h2>
        <p id="confirmation-text"></p>
        <div class="dialog-actions">
          <button
            class="button button-outline"
            id="cancel-finish"
            value="cancel"
            autofocus
          ></button>
          <button
            class="button button-primary"
            id="confirm-finish"
            value="finish"
          ></button>
        </div>
      </form>
    </dialog>
    <div
      class="sr-only"
      id="announcer"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </body>
</html>
